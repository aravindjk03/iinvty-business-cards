<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Sathya Narayan | IINVTY Digital Business Card</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================
       THEME VARIABLES & RESET
       Color Palette: Blue #0a3cff, Navy #061a5c, White #ffffff, Light Sky #e8efff
       Company Name: IINVTY
       Motto: INVENT • INNOVATE • INSPIRE
       ========================================================== */
    :root {
      --color-blue: #0a3cff;
      --color-navy: #061a5c;
      --color-white: #ffffff;
      --color-sky: #e8efff;
      --color-muted: #64748b;
      --color-watermark: #8a9bb2;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px 50px 16px;
      background: linear-gradient(135deg, #061a5c 0%, #1548ff 100%);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top Brand Badge */
    .top-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(6, 26, 92, 0.25);
    }

    .top-brand-badge img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .top-brand-badge span {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffffff;
    }

    /* Container Query Card Wrapper */
    .card-outer-scene {
      width: 100%;
      max-width: 660px;
      container-type: inline-size;
      container-name: cardbox;
      margin: 0 auto;
    }

    .card-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Faint decorative ambient circles */
    .faint-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .circle-top-left {
      background: radial-gradient(circle, rgba(232, 239, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 65%, transparent 100%);
    }

    .circle-bottom-right {
      background: radial-gradient(circle, rgba(232, 239, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 70%, transparent 100%);
    }

    /* ==========================================================
       DESKTOP & TABLET VIEW (Container query cqw, 7:4 landscape)
       ========================================================== */
    @media (min-width: 581px) {
      .business-card {
        width: 100%;
        aspect-ratio: 7 / 4;
        background: #ffffff;
        border-radius: 3cqw;
        box-shadow:
          0 2.2cqw 5cqw -0.5cqw rgba(6, 26, 92, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.2);
        display: flex;
        position: relative;
        overflow: hidden;
        user-select: none;
      }

      .card-left {
        width: 37cqw;
        height: 100%;
        background: linear-gradient(155deg, #0a3cff 0%, #061a5c 100%);
        position: relative;
        overflow: hidden;
        border-top-right-radius: 6.5cqw;
        border-bottom-right-radius: 6.5cqw;
        box-shadow: 1.2cqw 0 2.8cqw rgba(6, 26, 92, 0.28);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 3.5cqw 2.4cqw 3cqw 2.4cqw;
        box-sizing: border-box;
        z-index: 2;
      }

      .circle-top-left {
        width: 25cqw;
        height: 25cqw;
        top: -7cqw;
        left: -6cqw;
      }

      .circle-bottom-right {
        width: 30cqw;
        height: 30cqw;
        bottom: -11cqw;
        right: -8cqw;
      }

      .brand-group {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 1.2cqw;
        z-index: 3;
      }

      .logo-square {
        width: 4.6cqw;
        height: 4.6cqw;
        background: #ffffff;
        border-radius: 1cqw;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0.4cqw 1cqw rgba(6, 26, 92, 0.25);
        overflow: hidden;
        padding: 0.35cqw;
        box-sizing: border-box;
        flex-shrink: 0;
      }

      .logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .logo-i-fallback {
        display: none;
        font-size: 2.9cqw;
        font-weight: 800;
        color: #0a3cff;
        line-height: 1;
      }

      .brand-name-text {
        font-size: 2.5cqw;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.06cqw;
        text-shadow: 0 0.2cqw 0.5cqw rgba(6, 26, 92, 0.4);
      }

      .photo-area {
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        margin: auto 0;
      }

      .photo-frame {
        width: 17cqw;
        height: 17cqw;
        border-radius: 50%;
        border: 0.6cqw solid #ffffff;
        box-shadow: 0 1cqw 2.5cqw rgba(6, 26, 92, 0.4);
        background: #e8efff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
        position: relative;
      }

      .employee-photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .employee-initials {
        font-size: 6.2cqw;
        font-weight: 800;
        color: #0a3cff;
        line-height: 1;
        letter-spacing: 0.08cqw;
        user-select: none;
      }

      .brand-tagline-motto {
        font-size: 1.3cqw;
        font-weight: 800;
        letter-spacing: 0.1cqw;
        text-transform: uppercase;
        color: #e8efff;
        opacity: 0.95;
        z-index: 3;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 0.2cqw 0.4cqw rgba(6, 26, 92, 0.4);
      }

      .card-right {
        width: 63cqw;
        height: 100%;
        background: #ffffff;
        padding: 4.4cqw 4.8cqw 3.6cqw 4.8cqw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        box-sizing: border-box;
        z-index: 1;
        overflow: hidden;
      }

      .white-layer-watermark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 32cqw;
        height: 32cqw;
        opacity: 0.07;
        pointer-events: none;
        user-select: none;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .white-layer-watermark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .emp-meta-block {
        display: flex;
        flex-direction: column;
      }

      .emp-name {
        font-size: 4.4cqw;
        font-weight: 800;
        color: #061a5c;
        line-height: 1.15;
        margin: 0 0 0.8cqw 0;
        letter-spacing: -0.02cqw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .emp-title {
        font-size: 2.2cqw;
        font-weight: 600;
        color: #64748b;
        margin: 0 0 1.8cqw 0;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .blue-accent-line {
        width: 5.5cqw;
        height: 0.45cqw;
        background: #0a3cff;
        border-radius: 0.25cqw;
        margin: 0 0 2.2cqw 0;
      }

      .emp-email-link {
        display: inline-flex;
        align-items: center;
        gap: 1.1cqw;
        font-size: 2.1cqw;
        font-weight: 500;
        color: #061a5c;
        text-decoration: none;
        margin: 0 0 2.8cqw 0;
        width: fit-content;
        max-width: 100%;
        transition: color 0.2s ease;
      }

      .email-svg-icon {
        width: 2.4cqw;
        height: 2.4cqw;
        stroke: #0a3cff;
        flex-shrink: 0;
      }

      .email-label-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Row of Five Round Blue Buttons with White Icons */
      .icon-button-row {
        display: flex;
        align-items: center;
        gap: 1.4cqw;
      }

      .round-blue-btn {
        width: 5.4cqw;
        height: 5.4cqw;
        border-radius: 50%;
        background: #0a3cff;
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 0.5cqw 1.3cqw rgba(10, 60, 255, 0.28);
        transition: background-color 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        cursor: pointer;
      }

      .round-blue-btn:hover {
        background: #061a5c;
        transform: translateY(-0.4cqw);
        box-shadow: 0 1cqw 2.2cqw rgba(6, 26, 92, 0.38);
      }

      .round-blue-btn:focus-visible {
        outline: 0.38cqw solid #061a5c;
        outline-offset: 0.35cqw;
      }

      .round-blue-btn svg {
        width: 2.6cqw;
        height: 2.6cqw;
        stroke: #ffffff;
        fill: none;
      }

      .bottom-right-domain {
        position: absolute;
        bottom: 2.8cqw;
        right: 4.8cqw;
        font-size: 1.9cqw;
        font-weight: 800;
        color: #8a9bb2;
        letter-spacing: 0.08cqw;
        user-select: none;
      }
    }

    /* ==========================================================
       MOBILE VIEW (Phones <= 580px width)
       Touch-friendly vertical card layout with 44px+ touch targets
       ========================================================== */
    @media (max-width: 580px) {
      body {
        padding: 18px 12px 40px 12px;
        justify-content: flex-start;
      }

      .top-brand-badge {
        margin-bottom: 16px;
        padding: 6px 16px;
      }

      .card-outer-scene {
        max-width: 400px;
      }

      .business-card {
        width: 100%;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 14px 40px rgba(6, 26, 92, 0.42);
        overflow: hidden;
      }

      .card-left {
        width: 100%;
        background: linear-gradient(155deg, #0a3cff 0%, #061a5c 100%);
        position: relative;
        padding: 22px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-bottom-left-radius: 24px;
        border-bottom-right-radius: 24px;
        box-shadow: 0 8px 24px rgba(6, 26, 92, 0.3);
        z-index: 2;
        overflow: hidden;
      }

      .circle-top-left {
        width: 140px;
        height: 140px;
        top: -40px;
        left: -40px;
      }

      .circle-bottom-right {
        width: 180px;
        height: 180px;
        bottom: -60px;
        right: -50px;
      }

      .brand-group {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        margin-bottom: 14px;
        z-index: 3;
      }

      .logo-square {
        width: 32px;
        height: 32px;
        background: #ffffff;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        box-sizing: border-box;
      }

      .logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .logo-i-fallback {
        display: none;
        font-size: 18px;
        font-weight: 800;
        color: #0a3cff;
      }

      .brand-name-text {
        font-size: 18px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.05em;
      }

      .photo-area {
        margin: 6px 0 14px 0;
        z-index: 3;
      }

      .photo-frame {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 4px solid #ffffff;
        box-shadow: 0 8px 22px rgba(6, 26, 92, 0.4);
        background: #e8efff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .employee-photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .employee-initials {
        font-size: 32px;
        font-weight: 800;
        color: #0a3cff;
      }

      .brand-tagline-motto {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        color: #e8efff;
        text-transform: uppercase;
        text-align: center;
        z-index: 3;
      }

      .card-right {
        width: 100%;
        background: #ffffff;
        padding: 24px 20px 20px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
        z-index: 1;
        overflow: hidden;
      }

      .white-layer-watermark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 190px;
        height: 190px;
        opacity: 0.06;
        pointer-events: none;
        user-select: none;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .white-layer-watermark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .emp-meta-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .emp-name {
        font-size: 23px;
        font-weight: 800;
        color: #061a5c;
        margin-bottom: 4px;
        line-height: 1.2;
      }

      .emp-title {
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 12px;
      }

      .blue-accent-line {
        width: 44px;
        height: 3px;
        background: #0a3cff;
        border-radius: 2px;
        margin-bottom: 14px;
      }

      .emp-email-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #061a5c;
        text-decoration: none;
        margin-bottom: 22px;
        padding: 7px 14px;
        background: #e8efff;
        border-radius: 10px;
        max-width: 100%;
      }

      .email-svg-icon {
        width: 18px;
        height: 18px;
        stroke: #0a3cff;
        flex-shrink: 0;
      }

      .email-label-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 5 Large touch buttons for mobile */
      .icon-button-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        margin-bottom: 14px;
      }

      .round-blue-btn {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #0a3cff;
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(10, 60, 255, 0.28);
        transition: transform 0.2s ease, background-color 0.2s ease;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .round-blue-btn:active {
        transform: scale(0.92);
        background: #061a5c;
      }

      .round-blue-btn svg {
        width: 22px;
        height: 22px;
        stroke: #ffffff;
        fill: none;
      }

      .bottom-right-domain {
        font-size: 13px;
        font-weight: 800;
        color: #8a9bb2;
        letter-spacing: 0.1em;
        margin-top: 8px;
      }
    }

    /* Common Hover & Focus states */
    .emp-email-link:hover {
      color: #0a3cff;
      text-decoration: underline;
    }

    /* Save Contact Full-Width Button */
    .save-contact-container {
      width: 100%;
      margin-top: 18px;
    }

    .save-contact-button {
      width: 100%;
      padding: 16px 24px;
      background: #ffffff;
      color: #061a5c;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(6, 26, 92, 0.28);
      transition: all 0.22s ease;
    }

    .save-contact-button:hover {
      background: #e8efff;
      color: #0a3cff;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(6, 26, 92, 0.4);
    }

    .save-contact-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    /* Share bar */
    .share-info-bar {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
    }

    .copy-link-btn {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .copy-link-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ffffff;
    }

    /* Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 26, 92, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .sheet-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0 auto;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      padding: 14px 24px 28px 24px;
      z-index: 1001;
      box-shadow: 0 -10px 35px rgba(6, 26, 92, 0.3);
      transform: translateY(105%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-grabber {
      width: 42px;
      height: 4px;
      background: #d8e2f0;
      border-radius: 2px;
      margin: 0 auto 16px auto;
    }

    .sheet-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .sheet-badge-wrap {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #e8efff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1px solid rgba(10, 60, 255, 0.15);
      padding: 6px;
      box-sizing: border-box;
    }

    .sheet-badge-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sheet-title {
      font-size: 19px;
      font-weight: 700;
      color: #061a5c;
      margin: 0 0 6px 0;
    }

    .sheet-subtitle {
      font-size: 13.5px;
      color: #64748b;
      margin: 0 0 22px 0;
      line-height: 1.45;
    }

    .sheet-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .sheet-btn {
      flex: 1;
      padding: 13px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .sheet-btn-later {
      background: #e8efff;
      color: #061a5c;
    }

    .sheet-btn-later:hover {
      background: #d7e4ff;
    }

    .sheet-btn-save {
      background: #0a3cff;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(10, 60, 255, 0.35);
    }

    .sheet-btn-save:hover {
      background: #061a5c;
      box-shadow: 0 6px 18px rgba(6, 26, 92, 0.45);
    }

    .toast-notice {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: #061a5c;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
    }

    .toast-notice.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;

      <h2 class="sheet-title" id="sheetTitle">Add Sathya to your contacts?</h2>
      <p class="sheet-subtitle">Save Sathya Narayan's contact details directly to your phone.</p>
      
      <div class="sheet-actions">
        <button type="button" class="sheet-btn sheet-btn-later" onclick="closeBottomSheet()">Later</button>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-notice" id="toastNotice">Card link copied to clipboard!</div>

  <!-- ==========================================================
       JAVASCRIPT
       ========================================================== */
    const EMPLOYEE = {
      name: "Sathya Narayan",
      title: "Audit and Training Wing Head",
      email: "iinvtycorporate@gmail.com",
      phone: "+91 98765 43210",
      whatsapp: "919876543210",
      website: "https://iinvty.com",
      linkedin: "https://www.linkedin.com/company/iinvty",
      instagram: "https://www.instagram.com/iinvty",
      photo: ""
    };

    /* VCARD 3.0 GENERATOR (.VCF) */
    function downloadVCard() {
      const nameParts = EMPLOYEE.name.trim().split(/\s+/);
      const firstName = nameParts[0] || '';
      const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
      const whatsappDigits = (EMPLOYEE.whatsapp || '').replace(/[^0-9]/g, '');

      const lines = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${EMPLOYEE.name}`,
        `N:${lastName};${firstName};;;`,
        'ORG:IINVTY',
        `TITLE:${EMPLOYEE.title || ''}`,
        `TEL;TYPE=CELL,VOICE;TYPE=pref:${EMPLOYEE.phone || ''}`,
        `EMAIL;TYPE=INTERNET,WORK;TYPE=pref:${EMPLOYEE.email || ''}`,
        `URL;TYPE=WORK:${EMPLOYEE.website || 'https://iinvty.com'}`
      ];

      if (whatsappDigits) {
        lines.push(`URL;TYPE=WhatsApp:https://wa.me/${whatsappDigits}`);
        lines.push(`X-SOCIALPROFILE;TYPE=whatsapp:https://wa.me/${whatsappDigits}`);
      }
      if (EMPLOYEE.linkedin) {
        lines.push(`URL;TYPE=LinkedIn:${EMPLOYEE.linkedin}`);
        lines.push(`X-SOCIALPROFILE;TYPE=linkedin:${EMPLOYEE.linkedin}`);
      }
      if (EMPLOYEE.instagram) {
        lines.push(`URL;TYPE=Instagram:${EMPLOYEE.instagram}`);
        lines.push(`X-SOCIALPROFILE;TYPE=instagram:${EMPLOYEE.instagram}`);
      }
      if (EMPLOYEE.photo) {
        lines.push(`PHOTO;VALUE=URI:${EMPLOYEE.photo}`);
      }

      lines.push(`NOTE:Digital Business Card for ${EMPLOYEE.name} - IINVTY (INVENT • INNOVATE • INSPIRE)`);
      lines.push(`REV:${new Date().toISOString()}`);
      lines.push('END:VCARD');

      const vcardContent = lines.join('\r\n');
      const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8;' });
      const filename = `${EMPLOYEE.name}.vcf`;

      if (typeof navigator !== 'undefined' && navigator.msSaveBlob) {
        navigator.msSaveBlob(blob, filename);
      } else {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 3000);
      }
    }

    /* BOTTOM SHEET SLIDE-UP */
    function openBottomSheet() {
      const sheet = document.getElementById('bottomSheet');
      const backdrop = document.getElementById('sheetBackdrop');
      if (sheet && backdrop) {
        sheet.classList.add('open');
        backdrop.classList.add('active');
      }
    }

    function closeBottomSheet() {
      const sheet = document.getElementById('bottomSheet');
      const backdrop = document.getElementById('sheetBackdrop');
      if (sheet && backdrop) {
        sheet.classList.remove('open');
        backdrop.classList.remove('active');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeBottomSheet();
    });

    /* COPY CARD URL */
    function copyCardUrl() {
      const url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(showToast);
      } else {
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast();
      }
    }

    function showToast() {
      const toast = document.getElementById('toastNotice');
      if (toast) {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2400);
      }
    }

    /* SLIDE UP BOTTOM SHEET AFTER 0.7 SECONDS */
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        openBottomSheet();
      }, 700);
    });
  </script>
